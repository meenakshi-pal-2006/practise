<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Neon Arena</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #080b12;
    color: white;
    font-family: Arial, sans-serif;

    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    width: 95%;
    max-width: 1100px;
}

h1 {
    text-align: center;
    margin-bottom: 15px;
    color: #00eaff;
}

.game-wrapper {
    position: relative;

    border: 2px solid #273142;

    background: #0d111a;

    box-shadow:
        0 0 30px rgba(0, 234, 255, 0.15);
}

canvas {
    display: block;
    width: 100%;
    height: auto;
}

.controls {
    display: flex;
    justify-content: space-between;

    margin-top: 15px;

    padding: 15px;

    background: #111722;

    border-radius: 8px;
}

.player-control {
    width: 45%;
}

.player-control h3 {
    margin-bottom: 8px;
}

.p1 {
    color: #ff3864;
}

.p2 {
    color: #00eaff;
}

.instructions {
    line-height: 1.7;
    font-size: 14px;
    color: #aaa;
}

button {
    display: block;

    margin: 15px auto 0;

    padding: 10px 25px;

    border: none;
    border-radius: 6px;

    background: #00eaff;
    color: #071018;

    font-weight: bold;

    cursor: pointer;
}

button:hover {
    background: #66f2ff;
}

</style>
</head>

<body>

<div class="container">

<h1>⚡ NEON ARENA</h1>

<div class="game-wrapper">

<canvas
    id="game"
    width="1000"
    height="600">
</canvas>

</div>

<div class="controls">

<div class="player-control">

<h3 class="p1">
🔴 PLAYER 1
</h3>

<div class="instructions">

Move:
<strong>W A S D</strong>

<br>

Shoot:
<strong>F</strong>

</div>

</div>


<div class="player-control">

<h3 class="p2">
🔵 PLAYER 2
</h3>

<div class="instructions">

Move:
<strong>ARROW KEYS</strong>

<br>

Shoot:
<strong>L</strong>

</div>

</div>

</div>

<button onclick="restartGame()">
RESTART GAME
</button>

</div>


<script>

// =====================================================
// CANVAS
// =====================================================

const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");

const WIDTH = canvas.width;
const HEIGHT = canvas.height;


// =====================================================
// GAME
// =====================================================

let gameRunning = true;

let bullets = [];

let particles = [];

let keys = {};

let winner = null;


// =====================================================
// PLAYER
// =====================================================

class Player {

    constructor(
        x,
        y,
        color,
        controls
    ) {

        this.x = x;
        this.y = y;

        this.width = 34;
        this.height = 34;

        this.color = color;

        this.speed = 4;

        this.health = 100;

        this.maxHealth = 100;

        this.controls = controls;

        this.lastShot = 0;

        this.shootDelay = 250;

        this.angle = 0;

        this.score = 0;

    }


    update() {

        if (!gameRunning)
            return;


        let dx = 0;
        let dy = 0;


        if (keys[this.controls.up])
            dy -= 1;

        if (keys[this.controls.down])
            dy += 1;

        if (keys[this.controls.left])
            dx -= 1;

        if (keys[this.controls.right])
            dx += 1;


        // Normalize diagonal movement

        if (dx !== 0 && dy !== 0) {

            dx *= 0.707;
            dy *= 0.707;

        }


        this.x += dx * this.speed;
        this.y += dy * this.speed;


        // Arena boundaries

        this.x =
            Math.max(
                20,
                Math.min(
                    WIDTH - this.width - 20,
                    this.x
                )
            );


        this.y =
            Math.max(
                80,
                Math.min(
                    HEIGHT - this.height - 20,
                    this.y
                )
            );


        // Shooting

        if (keys[this.controls.shoot]) {

            this.shoot();

        }

    }


    shoot() {

        const now = Date.now();


        if (
            now - this.lastShot <
            this.shootDelay
        ) {

            return;

        }


        this.lastShot = now;


        let enemy;


        if (this === player1) {

            enemy = player2;

        } else {

            enemy = player1;

        }


        const centerX =
            this.x + this.width / 2;

        const centerY =
            this.y + this.height / 2;


        const enemyX =
            enemy.x + enemy.width / 2;

        const enemyY =
            enemy.y + enemy.height / 2;


        const angle =
            Math.atan2(
                enemyY - centerY,
                enemyX - centerX
            );


        bullets.push({

            x: centerX,

            y: centerY,

            vx: Math.cos(angle) * 9,

            vy: Math.sin(angle) * 9,

            owner: this,

            radius: 5,

            color: this.color

        });

    }


    draw() {

        // Body

        ctx.fillStyle =
            this.color;

        ctx.fillRect(
            this.x,
            this.y,
            this.width,
            this.height
        );


        // Gun

        let enemy =
            this === player1
                ? player2
                : player1;


        const cx =
            this.x +
            this.width / 2;

        const cy =
            this.y +
            this.height / 2;


        const ex =
            enemy.x +
            enemy.width / 2;

        const ey =
            enemy.y +
            enemy.height / 2;


        const angle =
            Math.atan2(
                ey - cy,
                ex - cx
            );


        ctx.save();

        ctx.translate(
            cx,
            cy
        );

        ctx.rotate(angle);


        ctx.fillStyle =
            "#ddd";

        ctx.fillRect(
            5,
            -4,
            25,
            8
        );


        ctx.restore();


        // Center

        ctx.fillStyle =
            "#111";

        ctx.beginPath();

        ctx.arc(
            cx,
            cy,
            8,
            0,
            Math.PI * 2
        );

        ctx.fill();


        // Health bar

        const barWidth = 45;

        const healthWidth =
            barWidth *
            (this.health / this.maxHealth);


        ctx.fillStyle =
            "#222";

        ctx.fillRect(
            this.x - 5,
            this.y - 13,
            barWidth,
            6
        );


        ctx.fillStyle =
            this.color;

        ctx.fillRect(
            this.x - 5,
            this.y - 13,
            healthWidth,
            6
        );

    }

}


// =====================================================
// PLAYERS
// =====================================================

let player1 =
    new Player(
        120,
        280,
        "#ff3864",
        {

            up: "w",
            down: "s",
            left: "a",
            right: "d",
            shoot: "f"

        }
    );


let player2 =
    new Player(
        840,
        280,
        "#00eaff",
        {

            up: "ArrowUp",
            down: "ArrowDown",
            left: "ArrowLeft",
            right: "ArrowRight",
            shoot: "l"

        }
    );


// =====================================================
// KEYBOARD
// =====================================================

document.addEventListener(
    "keydown",
    event => {

        keys[event.key] = true;

        if (
            event.key === " "
        ) {

            event.preventDefault();

        }

    }
);


document.addEventListener(
    "keyup",
    event => {

        keys[event.key] = false;

    }
);


// =====================================================
// BULLETS
// =====================================================

function updateBullets() {

    for (
        let i = bullets.length - 1;
        i >= 0;
        i--
    ) {

        const bullet =
            bullets[i];


        bullet.x += bullet.vx;

        bullet.y += bullet.vy;


        // Outside arena

        if (

            bullet.x < 0 ||
            bullet.x > WIDTH ||
            bullet.y < 60 ||
            bullet.y > HEIGHT

        ) {

            bullets.splice(i, 1);

            continue;

        }


        const target =
            bullet.owner === player1
                ? player2
                : player1;


        // Collision

        if (
            bullet.x >
                target.x &&

            bullet.x <
                target.x +
                target.width &&

            bullet.y >
                target.y &&

            bullet.y <
                target.y +
                target.height
        ) {

            target.health -= 20;

            createExplosion(
                bullet.x,
                bullet.y,
                bullet.color
            );


            bullets.splice(i, 1);


            if (
                target.health <= 0
            ) {

                target.health = 0;

                gameOver(
                    bullet.owner
                );

            }

        }

    }

}


// =====================================================
// PARTICLES
// =====================================================

function createExplosion(
    x,
    y,
    color
) {

    for (
        let i = 0;
        i < 12;
        i++
    ) {

        particles.push({

            x,
            y,

            vx:
                (Math.random() - 0.5)
                * 7,

            vy:
                (Math.random() - 0.5)
                * 7,

            life: 30,

            color

        });

    }

}


function updateParticles() {

    for (
        let i = particles.length - 1;
        i >= 0;
        i--
    ) {

        const p =
            particles[i];


        p.x += p.vx;

        p.y += p.vy;

        p.life--;


        if (
            p.life <= 0
        ) {

            particles.splice(i, 1);

        }

    }

}


function drawParticles() {

    particles.forEach(p => {

        ctx.globalAlpha =
            p.life / 30;

        ctx.fillStyle =
            p.color;

        ctx.fillRect(
            p.x,
            p.y,
            4,
            4
        );

    });


    ctx.globalAlpha = 1;

}


// =====================================================
// ARENA
// =====================================================

function drawArena() {

    // Background

    ctx.fillStyle =
        "#090d16";

    ctx.fillRect(
        0,
        0,
        WIDTH,
        HEIGHT
    );


    // Grid

    ctx.strokeStyle =
        "#151e2e";

    ctx.lineWidth = 1;


    for (
        let x = 0;
        x < WIDTH;
        x += 50
    ) {

        ctx.beginPath();

        ctx.moveTo(
            x,
            60
        );

        ctx.lineTo(
            x,
            HEIGHT
        );

        ctx.stroke();

    }


    for (
        let y = 60;
        y < HEIGHT;
        y += 50
    ) {

        ctx.beginPath();

        ctx.moveTo(
            0,
            y
        );

        ctx.lineTo(
            WIDTH,
            y
        );

        ctx.stroke();

    }


    // Arena border

    ctx.strokeStyle =
        "#26364d";

    ctx.lineWidth = 3;

    ctx.strokeRect(
        15,
        65,
        WIDTH - 30,
        HEIGHT - 80
    );


    // Center line

    ctx.strokeStyle =
        "#1f2c40";

    ctx.setLineDash([
        10,
        10
    ]);

    ctx.beginPath();

    ctx.moveTo(
        WIDTH / 2,
        65
    );

    ctx.lineTo(
        WIDTH / 2,
        HEIGHT - 15
    );

    ctx.stroke();

    ctx.setLineDash([]);

}


// =====================================================
// HUD
// =====================================================

function drawHUD() {

    ctx.fillStyle =
        "#0e1420";

    ctx.fillRect(
        0,
        0,
        WIDTH,
        60
    );


    // Player 1

    ctx.fillStyle =
        "#ff3864";

    ctx.font =
        "bold 18px Arial";

    ctx.fillText(
        "PLAYER 1",
        25,
        25
    );


    ctx.fillStyle =
        "#aaa";

    ctx.font =
        "13px Arial";

    ctx.fillText(
        "WASD + F",
        25,
        45
    );


    // Player 2

    ctx.fillStyle =
        "#00eaff";

    ctx.font =
        "bold 18px Arial";

    ctx.fillText(
        "PLAYER 2",
        WIDTH - 120,
        25
    );


    ctx.fillStyle =
        "#aaa";

    ctx.font =
        "13px Arial";

    ctx.fillText(
        "ARROWS + L",
        WIDTH - 120,
        45
    );


    // Center

    ctx.fillStyle =
        "#fff";

    ctx.font =
        "bold 20px Arial";

    ctx.textAlign =
        "center";

    ctx.fillText(
        "NEON ARENA",
        WIDTH / 2,
        35
    );

    ctx.textAlign =
        "left";

}


// =====================================================
// BULLETS DRAW
// =====================================================

function drawBullets() {

    bullets.forEach(
        bullet => {

            ctx.fillStyle =
                bullet.color;

            ctx.beginPath();

            ctx.arc(
                bullet.x,
                bullet.y,
                bullet.radius,
                0,
                Math.PI * 2
            );

            ctx.fill();

        }
    );

}


// =====================================================
// GAME OVER
// =====================================================

function gameOver(
    winnerPlayer
) {

    gameRunning = false;

    winner =
        winnerPlayer;

}


// =====================================================
// DRAW GAME OVER
// =====================================================

function drawGameOver() {

    if (gameRunning)
        return;


    ctx.fillStyle =
        "rgba(0,0,0,0.65)";

    ctx.fillRect(
        0,
        0,
        WIDTH,
        HEIGHT
    );


    ctx.textAlign =
        "center";


    ctx.fillStyle =
        winner.color;

    ctx.font =
        "bold 40px Arial";

    ctx.fillText(
        winner === player1
            ? "PLAYER 1 WINS!"
            : "PLAYER 2 WINS!",
        WIDTH / 2,
        HEIGHT / 2 - 20
    );


    ctx.fillStyle =
        "#fff";

    ctx.font =
        "18px Arial";

    ctx.fillText(
        "Press R or click RESTART",
        WIDTH / 2,
        HEIGHT / 2 + 25
    );


    ctx.textAlign =
        "left";

}


// =====================================================
// RESTART
// =====================================================

function restartGame() {

    player1 =
        new Player(
            120,
            280,
            "#ff3864",
            {

                up: "w",
                down: "s",
                left: "a",
                right: "d",
                shoot: "f"

            }
        );


    player2 =
        new Player(
            840,
            280,
            "#00eaff",
            {

                up: "ArrowUp",
                down: "ArrowDown",
                left: "ArrowLeft",
                right: "ArrowRight",
                shoot: "l"

            }
        );


    bullets = [];

    particles = [];

    winner = null;

    gameRunning = true;

}


// =====================================================
// GAME LOOP
// =====================================================

function gameLoop() {

    player1.update();

    player2.update();

    updateBullets();

    updateParticles();


    drawArena();

    drawHUD();

    drawBullets();

    player1.draw();

    player2.draw();

    drawParticles();

    drawGameOver();


    requestAnimationFrame(
        gameLoop
    );

}


gameLoop();

</script>

</body>
</html>
