<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="headphone.css">
</head>
<body>
    <div class="product-card">
        <span class="badge">-20%</span>
        <div class="wishlist">🩷</div>
        <img src="https://www.bing.com/th/id/OIP.RSC3hISnMBMNdc51vlVQdwHaHa?w=193&h=193&c=8&rs=1&qlt=90&o=6&pid=ImgAns&rm=2">
        <div class="content">
        <h3>Wireless Headphones</h3>
        <div class="rating">
            <span class="stars">⭐⭐⭐⭐</span>
            <span class="reviews">(128 Reviews)</span>
        </div>
        <p class="desc">
            High quality sound with deep bass 
            and comfortable design,
        </p>
        <div class="price">
            <span class="current">$89.99</span>
            <span class="old">$95.99</span>
        </div>
        <div class="actions">
            <div class="qty">
                <button>-</button>
                <span>10</span>
                <button>+</button>
            </div>
            <button class="add-cart">🛒 Add to Cart</button>
        </div>
        </div>
    </div>
</body>
</html>
