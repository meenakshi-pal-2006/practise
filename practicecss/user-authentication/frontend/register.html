<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

    <div class="form-box">

        <h1>Create Account</h1>

        <p class="subtitle">
            Register a new account
        </p>

        <form id="registerForm">

            <div class="input-group">

                <label>Full Name</label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your full name"
                    required
                >

            </div>


            <div class="input-group">

                <label>Email</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="input-group">

                <label>Phone</label>

                <input
                    type="tel"
                    id="phone"
                    placeholder="Enter your phone number"
                    pattern="[0-9]{10}"
                    required
                >

            </div>


            <div class="input-group">

                <label>Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Create a password"
                    minlength="6"
                    required
                >

            </div>


            <div class="input-group">

                <label>Confirm Password</label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm your password"
                    required
                >

            </div>


            <button type="submit">
                Register
            </button>

        </form>


        <p class="switch">

            Already have an account?

            <a href="index.html">
                Login
            </a>

        </p>

    </div>

</div>

<script src="script.js"></script>

</body>

</html>
