    <!-- box model is the foundtional layout concept in web development. every html element rendered on a wed page is treated as a rectangular box

        padding refers to the space  added inside borderi.e its seperated content and border layer
       Border- border refers to aline surrounding the padding and the content.we can style border via border- color,border-width,border-style
       Margin- it is added outside the border thus its creates space from the other element.
                TYPE OF BORDER ELEMENT
            Q. how an element total physical widtht & height are calculated depends on the box sizing propertise.based on gthe value of box sizinf we can have two different box model
                1.Standard box model:
                    by default browser used content -box value for box sizing property.In these box model if we are setting width=200px then that 200px applies only to the content 
                    area.any padding amd border are added on the top ofthat width.
